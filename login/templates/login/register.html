{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario - IA Desk</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #0b0f19;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .register-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .register-header .logo {
            font-size: 2.8rem;
            margin-bottom: 8px;
        }
        .register-header h1 {
            font-size: 1.4rem;
            margin: 0 0 6px 0;
            color: #f8fafc;
        }
        .register-header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 0;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            box-sizing: border-box;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .btn-submit {
            width: 100%;
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
        .error-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }
        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748b;
        }
        .footer-links a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-header">
            <div class="logo">🤖</div>
            <h1>Crear Cuenta</h1>
            <p>Registra un nuevo usuario para acceder a IA Desk</p>
        </div>

        {% if error %}
            <div class="error-alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Nombre de usuario" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico (opcional)</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirmar Contraseña</label>
                <input type="password" id="password_confirm" name="password_confirm" required placeholder="••••••••" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-submit">Registrar e Ingresar</button>
        </form>

        <div class="footer-links">
            ¿Ya tienes cuenta? <a href="{% url 'login' %}">Iniciar sesión</a>
        </div>
    </div>
</body>
</html>
